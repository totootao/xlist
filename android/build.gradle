buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs "$rootProject.projectDir/aars"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')

    // 统一 Kotlin 依赖版本
    project.configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        }
    }
}

// 强制所有插件模块使用 compileSdk 34, 修复 lStar 资源错误
// (在模块评估完成后覆盖, 排除已被提前评估的 :app 模块)
subprojects {
    if (it.path != ':app' && !it.state.executed) {
        it.afterEvaluate { project ->
            if (project.plugins.hasPlugin('com.android.library')) {
                try {
                    project.android.compileSdkVersion 34
                } catch (ignored) {
                    try {
                        project.android.compileSdk = 34
                    } catch (ignored2) {}
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
