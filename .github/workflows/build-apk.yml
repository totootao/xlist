name: Build Android APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Generate code (floor / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK (armeabi-v7a + arm64-v8a)
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/xlist-release.apk

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs output/xlist-release.apk || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlist-apk
          path: output/xlist-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/xlist-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
